
name: Build Pro Camera APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p work
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip "$ZIP_FILE" -d work

      - name: Build APK
        run: gradle -p work/ProCamera assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProCamera-APK
          path: work/ProCamera/app/build/outputs/apk/debug/*.apk
          
